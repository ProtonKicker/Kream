import org.json.JSONArray
import org.json.JSONObject

import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.util.zip.ZipEntry
import java.util.zip.ZipInputStream

plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

apply plugin: 'kotlin-kapt'

def commit = getGitCommitHash(file('.'))

def keystorePropertiesFile = rootProject.file('local.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def hasReleaseKeystore = keystoreProperties['key.store'] != null &&
        file(keystoreProperties['key.store']).exists()

android {
    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile file(keystoreProperties['key.store'])
                storePassword keystoreProperties['key.store.password']
                keyAlias keystoreProperties['key.alias']
                keyPassword keystoreProperties['key.key.password']
            }
        }
    }
    namespace 'ru.ytkab0bp.beamklipper'
    compileSdk 35

    defaultConfig {
        applicationId "com.protonkicker.kream"
        minSdk 21
        targetSdk 35
        multiDexEnabled true
        multiDexKeepFile file('multidex-keep.txt')
        multiDexKeepProguard file('multidex-keep.pro')
        versionCode 11
        versionName "v0"

        buildConfigField "int", "SLOTS_COUNT", "4"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        python {
            version = "3.10"
            def configuredBuildPython = keystoreProperties['chaquopy.python'] ?:
                    System.getenv('CHAQUOPY_PYTHON')
            if (configuredBuildPython != null && !configuredBuildPython.trim().isEmpty()) {
                buildPython configuredBuildPython.trim()
            }
            pip {
                options("--find-links", "file://" + project.projectDir.toString() + "/python_wheels")

                install "cffi==1.15.1"
                install "pyserial==3.5"
                install "greenlet==3.0.1"
                install "python-can==3.3.4"
                install "markupsafe==2.1.5"
                install "tornado==6.4.0"
                install "pyserial-asyncio==0.6"
                // Moonraker wants pillow>=9.5.0, but Chaquopy's wheel mirror
                // only ships cp310 pillow up to 9.2.0. The 9.5.0 wheels for all
                // three ABIs are cross-compiled locally into python_wheels/
                // (see docs/build-pillow-wheels.md).
                install "pillow==9.5.0"
                // The locally-built Pillow wheel links against libjpeg_chaquopy.so
                // (DT_NEEDED) but, unlike Chaquopy's own Pillow wheel, does not
                // declare the Requires-Dist on chaquopy-libjpeg. Without this line
                // libjpeg_chaquopy.so is never bundled and PIL/_imaging.so fails to
                // dlopen at runtime -> metadata/thumbnail extraction crashes.
                install "chaquopy-libjpeg==1.5.3"
                install "streaming-form-data==1.15.0"
                install "distro==1.9.0"
                install "inotify-simple==2.0.1"
                install "libnacl==2.1.0"
                install "paho-mqtt==2.1.0"
                install "zeroconf==0.131.0"
                install "preprocess-cancellation==0.2.1"
                install "jinja2==3.1.6"
                install "dbus-fast==5.0.22"
                install "apprise==1.13.0"
                install "ldap3==2.9.1"
                install "python-periphery==2.4.1"
                install "pynacl==1.5.0"
                install "importlib_metadata==9.0.0"

                install "numpy==1.26.2"
                install "click==8.1.8"
            }
            pyc {
                src true
            }
        }
    }

    flavorDimensions 'abi'

    productFlavors {
        armv7 {
            dimension 'abi'
            ndk {
                abiFilters 'armeabi-v7a'
            }
        }
        arm64 {
            dimension 'abi'
            ndk {
                abiFilters 'arm64-v8a'
            }
        }
        amd64 {
            dimension 'abi'
            ndk {
                abiFilters 'x86_64'
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
            buildConfigField "boolean", "IS_GOOGLE_PLAY", "false"
            buildConfigField "String", "COMMIT", "\"" + commit + "\""
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            buildConfigField "boolean", "IS_GOOGLE_PLAY", "false"
            buildConfigField "String", "COMMIT", "\"" + commit + "\""
            ndk {
                debugSymbolLevel 'NONE'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    externalNativeBuild {
        cmake {
            path file('CMakeLists.txt')
        }
        ndkVersion "23.2.8568313"
    }

    buildFeatures {
        aidl true
        buildConfig true
        compose true
    }

    kapt {
        correctErrorTypes true
    }

    kotlinOptions {
        jvmTarget = "11"
        freeCompilerArgs += [
            "-P",
            "plugin:androidx.compose.compiler.plugins.kotlin:strongSkipping=true",
            "-P",
            "plugin:androidx.compose.compiler.plugins.kotlin:reportsDestination=${buildDir}/compose_reports"
        ]
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def abi = output.getFilter(com.android.build.OutputFile.ABI)
            def suffix = abi != null ? abi : variant.flavorName
            outputFileName = "KocoaBeam_" + commit + (suffix ? "_" + suffix : "") + ".apk"
        }
    }
}

